[tools]
node = "26.12.1"
"npm:pnpm" = "12.15.0"
go = "1.27.3"

[tasks.install]
description = "Install backend & frontend dependencies"
run = """
cd backend && go mod download
cd ../frontend && NODE_OPTIONS=--max-old-space-size=512 pnpm install
"""

[tasks.dev]
description = "Run Go API (8090) and Vite dev server (5173) together"
run = """
trap 'kill 0' EXIT
(cd backend && GOMAXPROCS=1 GOFLAGS=-p=1 go run ./cmd/server) &
(cd frontend && NODE_OPTIONS=--max-old-space-size=512 pnpm dev) &
wait
"""

[tasks."dev:api"]
description = "Run Go API server"
run = "cd backend && GOMAXPROCS=1 GOFLAGS=-p=1 go run ./cmd/server"

[tasks."dev:web"]
description = "Run Vite dev server"
run = "cd frontend && NODE_OPTIONS=--max-old-space-size=512 pnpm dev"

[tasks.build]
description = "Build the SPA, embed it in Go, and compile one production binary"
run = """
cd frontend && NODE_OPTIONS=--max-old-space-size=512 pnpm build
cd ..
rm -rf backend/internal/web/dist
cp -r frontend/dist backend/internal/web/dist
cd backend && GOFLAGS=-p=1 go build -o bin/friday-server ./cmd/server
"""

[tasks.serve]
description = "Run the production binary (serves API + SPA)"
run = "cd backend && ./bin/friday-server"

[tasks.test]
description = "Run backend tests"
run = "cd backend && go test ./..."
